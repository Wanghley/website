    <meta name="description" content="Wanghley Soares Martins: Brazilian engineer and PhD student at Rice University building wearable biosensors and the microwatt AI that runs on them." />
    <meta name="theme-color" content="#121314" />
    <link rel="alternate" hreflang="en" href="https://wanghley.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Type system: wordmark face (local) + Bricolage Grotesque (text) + IBM Plex Mono. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="google-site-verification" content="g8x_87Cb0hLbe6qgpFdV-I3oNhXfUE2GvCePdBxjeqU" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Hero hologram head model — meshopt-compressed to ~350KB (see
         scripts/build-head-precompute.js). Preloaded as `fetch` (not
         a font/image `as`) since it's consumed by useGLTF/GLTFLoader via
         XHR/fetch, not the browser's native resource decoders; only fires
         for visitors who clear useCanRender3D()'s gate in practice, since
         the SVG-fallback path never imports the component that requests
         it, but a same-origin preload the fallback path ignores is
         harmless. -->
    <link rel="preload" as="fetch" crossorigin href="%PUBLIC_URL%/models/wsm-figure.glb" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Wanghley Soares Martins | Rice ECE · Wearable biosensors</title>
  </head>
